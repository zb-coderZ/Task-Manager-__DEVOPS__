apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-part3
  labels:
    app: frontend

spec:
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: frontend:local
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5173


---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devops-part3

spec:
  selector:
    app: frontend

  ports:
    - port: 5173
      targetPort: 5173

  type: ClusterIP